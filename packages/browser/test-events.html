<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare Events SDK Test Page</title>
    <!-- Include the built SDK UMD bundle -->
    <!-- Adjust the path if your built file is located elsewhere -->
    <script src="./dist/umd/index.js"></script>
</head>
<body>
    <h1>Cloudflare Events SDK Test Page</h1>
    <p>Open the browser console to see event logs.</p>

    <!-- Initialize the SDK on page load -->
    <script>
        // Initialize the SDK with an optional writeKey and a test pipeline URL
        const cfevents = window.CfEvents.CfEventsBrowser.load({
            writeKey: undefined, // Explicitly undefined to test the optional writeKey
            cloudflarePipelineUrl: "https://d8ddfa11872f4b20a62fef626395d25c.ingest.cloudflare.com" // Use a test URL or your pipeline
        });

        console.log("SDK initialized:", cfevents);
    </script>

    <h2>Test Events</h2>
    <button id="trackBtn">Track Event</button>
    <button id="identifyBtn">Identify User</button>
    <button id="pageBtn">Page Event</button>
    <button id="aliasBtn">Alias Event</button>
    <button id="groupBtn">Group Event</button>
    <button id="resetBtn">Reset</button>

    <script>
        document.getElementById('trackBtn').addEventListener('click', () => {
            console.log("Tracking event...");
            cfevents.track('Test Track Event', {
                property1: 'value1',
                property2: 123
            }).catch(err => console.error("Track error:", err));
        });

        document.getElementById('identifyBtn').addEventListener('click', () => {
            console.log("Identifying user...");
            cfevents.identify('user-123', {
                email: 'user@example.com',
                name: 'Test User'
            }).catch(err => console.error("Identify error:", err));
        });

        document.getElementById('pageBtn').addEventListener('click', () => {
            console.log("Sending page event...");
            cfevents.page('Test Page', {
                path: '/test',
                title: 'Test Page Title'
            }).catch(err => console.error("Page error:", err));
        });

        document.getElementById('aliasBtn').addEventListener('click', () => {
            console.log("Sending alias event...");
            cfevents.alias('new-user-id-456', 'previous-user-id-123').catch(err => console.error("Alias error:", err));
        });

        document.getElementById('groupBtn').addEventListener('click', () => {
            console.log("Sending group event...");
            cfevents.group('group-789', {
                name: 'Test Group',
                industry: 'Technology'
            }).catch(err => console.error("Group error:", err));
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            console.log("Resetting...");
            cfevents.reset();
        });
    </script>
</body>
</html>
